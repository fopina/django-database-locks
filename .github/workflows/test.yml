# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  readme:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.9
    - name: Install renderer
      run: pip install readme_renderer
    - name: Test readme (before pypi errors)
      run: python -m readme_renderer README.rst

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.12', '3.14']
        database: [mysql, postgresql]
        include:
          - python-version: '3.9'
            django-factor: dj42
            mysql-version: '8.0'
            postgres-version: '12'
          - python-version: '3.10'
            django-factor: dj52
            mysql-version: '8.0'
            postgres-version: '14'
          - python-version: '3.12'
            django-factor: dj61
            mysql-version: '8.4'
            postgres-version: '15'
          - python-version: '3.14'
            django-factor: dj61
            mysql-version: '8.4'
            postgres-version: '15'

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
        - 8877:3306
        # needed because the container does not provide a healthcheck
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries=5
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
        - 8878:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        pip install tox
    - name: Toxit
      run: |
        tox -e py-${{ matrix.database }}-${{ matrix.django-factor }} -v
    
    - name: coverage xml
      run: |
        .tox/py-${{ matrix.database }}-${{ matrix.django-factor }}/bin/coverage xml
      if: ${{ matrix.python-version == '3.9' && matrix.database == 'mysql' }}

    - uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
      if: ${{ matrix.python-version == '3.9' && matrix.database == 'mysql' }}
