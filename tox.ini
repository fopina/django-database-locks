[tox]
envlist =
    flake8
    py39-dj42-{postgresql,mysql}
    py310-dj52-{postgresql,mysql}
    py{312,314}-dj61-{postgresql,mysql}

[testenv]
deps =
    dj22: Django==2.2.*
    dj30: Django==3.0.*
    dj32: Django==3.2.*
    dj42: Django==4.2.*
    dj52: Django==5.2.*
    dj61: Django==6.1.*
    postgresql: psycopg2-binary
    mysql: mysqlclient
    coverage
setenv =
    PYTHONPATH = {toxinidir}
    postgresql: DJANGO_SETTINGS_MODULE = settings_postgresql
    mysql: DJANGO_SETTINGS_MODULE = settings_mysql
allowlist_externals = make
pip_pre = True
commands = make coverage TEST_ARGS='{posargs:tests}'

[testenv:flake8]
basepython = python3
commands = make flake8
deps = flake8
skip_install = true

[testenv:style]
basepython = python3
commands = make style_check
deps =
    black>=19.10b0
    flake8
skip_install = true
